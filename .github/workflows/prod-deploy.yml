name: CI/CD for Main (Build Always, Choice Deploy)

on:
  push:
    branches:
      - main
  # 🌟 깃허브 Actions 페이지에서 수동 배포 버튼 활성화
  workflow_dispatch:
    inputs:
      image_tag:
        description: '배포할 이미지 태그를 입력하세요 (예: latest 또는 특정 날짜-SHA)'
        required: true
        default: 'latest'
      environment:
        description: '배포 환경 확인'
        required: true
        default: 'production'

env:
  AWS_REGION: ap-southeast-2
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID_SECRET }}
  ECR_REPOSITORY: commute_adventure_prod
  IMAGE_NAME: subway-worker-server

jobs:
  # ===============================================
  # 1. BUILD & PUSH (Push 발생 시마다 이미지 빌드 및 ECR 업로드)
  # ===============================================
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' # Push 이벤트일 때만 실행
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17 & Build JAR
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build JAR
        run: ./gradlew clean build -x test

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 고유 태그(날짜-SHA)와 latest 태그 두 개를 모두 푸시합니다.
      - name: Build & Push Docker Image
        run: |
          ECR_URI=${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          UNIQUE_TAG=$(date +'%Y%m%d')-$SHORT_SHA
          
          docker build -t ${{ env.IMAGE_NAME }}:latest -f Dockerfile .
          
          # 1. 고유 태그로 푸시 (나중에 선택 배포용)
          docker tag ${{ env.IMAGE_NAME }}:latest $ECR_URI:$UNIQUE_TAG
          docker push $ECR_URI:$UNIQUE_TAG
          
          # 2. latest 태그로 푸시 (기본 배포용)
          docker tag ${{ env.IMAGE_NAME }}:latest $ECR_URI:latest
          docker push $ECR_URI:latest

  # ===============================================
  # 2. DEPLOY (Actions에서 버튼 클릭 및 태그 입력 시 실행)
  # ===============================================
  deploy-prod:
    name: Production Deployment (Manual Choice)
    # 🌟 수동 실행일 때만 작동
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to PROD EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ${{ secrets.PROD_EC2_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            # 1. ECR 로그인
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
            
            # 2. 파라미터 스토어에서 비번 가져오기
            RDS_PASSWORD=$(aws ssm get-parameter --name "/config/subway_worker/prod/rds_password" --with-decryption --query "Parameter.Value" --output text --region ${{ env.AWS_REGION }})
            
            # 3. 사용자가 입력한 태그로 이미지 Pull (기본값: latest)
            SELECTED_TAG="${{ github.event.inputs.image_tag }}"
            ECR_URI="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:$SELECTED_TAG"
            
            echo "Deploying image: $ECR_URI"
            
            docker pull $ECR_URI
            docker stop prod-server || true
            docker rm prod-server || true
            
            # 4. 컨테이너 실행
            docker run -d --name prod-server -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e RDS_PASSWORD="$RDS_PASSWORD" \
              $ECR_URI
            
            docker ps
            
