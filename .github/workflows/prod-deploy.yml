name: "[PROD] - Deploy image to prod"

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: '배포할 이미지 태그 (예: latest)'
        required: true
        default: 'latest'

env:
  AWS_REGION: ap-southeast-2
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID_SECRET }}
  ECR_REPOSITORY: commute_adventure_prod

jobs:
  deploy-prod:
    name: Production Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          # dev에서 성공했던 Secret 명칭 그대로 사용
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          script: |
            # 1. ECR 로그인
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
            
            # 2. 파라미터 스토어에서 비번 가져오기
            RDS_PASSWORD=$(aws ssm get-parameter --name "/config/subway_worker/prod/rds_password" --with-decryption --query "Parameter.Value" --output text --region ${{ env.AWS_REGION }})
            
            # 3. 이미지 교체
            SELECTED_TAG="${{ github.event.inputs.image_tag }}"
            ECR_URI="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:$SELECTED_TAG"
            
            docker pull $ECR_URI
            docker stop prod-server || true
            docker rm prod-server || true
            
            # 4. 컨테이너 실행
            docker run -d --name prod-server -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=prod \
              $ECR_URI
            
            docker ps
