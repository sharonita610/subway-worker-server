name: CI/CD Pipeline for Subway Worker Server

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Artifact (속도 최적화 적용)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      # 🌟 1. 속도 개선: Gradle 종속성 캐싱
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle (테스트 제외)
        # --parallel 및 --daemon 옵션을 사용하여 빌드 최적화
        run: ./gradlew clean build -x test --parallel --daemon
        
      - name: Find and save the built JAR file name
        id: jar_file_name
        # build/libs/*.jar 파일 중 'plain'을 제외한 파일을 찾습니다.
        run: |
          JAR_FILE=$(ls build/libs/*.jar | grep -v 'plain' | tail -1)
          echo "JAR_FILE=$JAR_FILE" >> $GITHUB_ENV

      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: subway-worker-server-jar
          path: ${{ env.JAR_FILE }}

  # -------------------------------------------------------------------
  
  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    env:
      RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      
    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: subway-worker-server-jar
          
      - name: Get JAR filename again
        id: jar_file_name
        run: |
          JAR_FILE=$(ls *.jar | tail -1)
          echo "JAR_FILE_ONLY=$JAR_FILE" >> $GITHUB_ENV
          
      # 2. 배포: SSH를 통한 파일 전송 및 서비스 재시작
      - name: Deploy using SCP and SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 30s  # 이 값이 30초 정도로 설정되어 있어야 정상입니다.
          command_timeout: 10m
          script: |
            # EC2 서버의 기본 사용자 홈 디렉토리 경로 (ec2-user를 가정)
            APP_DIR=/home/${{ secrets.EC2_USER }}/subway-worker-server/build/libs
            JAR_NAME=${{ env.JAR_FILE_ONLY }}

            # 1. 기존 JAR 파일 삭제
            sudo rm -f $APP_DIR/subway-worker-server-*.jar
            
            # 2. JAR 파일 전송 (Artifacts를 원격지로 전송)
            # scp는 파일을 현재 디렉토리(GitHub Actions Runner)에서 원격지로 복사합니다.
            scp -i /dev/stdin $JAR_NAME ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:$APP_DIR/
            
            # 3. 서비스 환경 변수 설정 (Optional: service 파일에 없다면 여기서 설정)
            export RDS_PASSWORD=${{ env.RDS_PASSWORD }}
            export REDIS_PASSWORD=${{ env.REDIS_PASSWORD }}

            # 4. 서비스 재시작 (sudoers NOPASSWD 설정 필수)
            sudo systemctl daemon-reload
            sudo systemctl restart subway-worker
            
            # 5. 재시작 확인 (5초 대기 후 상태 확인)
            sleep 5
            sudo systemctl status subway-worker
