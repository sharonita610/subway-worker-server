name: CI/CD Pipeline for Subway Worker Server

on:
  push:
    branches:
      - main

jobs:
  # ===============================================
  # 1. BUILD JOB (속도 및 테스트 최적화)
  # ===============================================
  build:
    name: Build Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 🌟 속도 개선: Gradle 종속성 캐싱 (2차 실행부터 시간 단축)
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle (테스트 제외 및 최적화)
        run: ./gradlew clean build -x test --parallel --daemon

      - name: Find and save the built JAR file name
        id: jar_file_name
        run: |
          JAR_FILE=$(ls build/libs/*.jar | grep -v 'plain' | tail -1)
          echo "JAR_FILE=$JAR_FILE" >> $GITHUB_ENV

      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: subway-worker-server-jar
          path: ${{ env.JAR_FILE }}

  # ===============================================
  # 2. DEPLOY - UPLOAD JOB (파일 전송 문제 해결 및 경로 안정화)
  # ===============================================
  deploy-upload:
    name: Upload JAR File to EC2
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: subway-worker-server-jar

      - name: Get JAR filename
        id: jar_file_name
        run: |
          JAR_FILE=$(ls *.jar | tail -1)
          echo "JAR_FILE_ONLY=$JAR_FILE" >> $GITHUB_ENV

      # 🌟 파일 전송 문제 해결: appleboy/scp-action 전용 사용
      - name: Transfer file using SCP Action
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ${{ env.JAR_FILE_ONLY }}
          # 🌟 경로 안정화: 사용자 홈 디렉토리(~) 기반으로 지정
          target: ~/subway-worker-server/build/libs
          overwrite: true

  # ===============================================
  # 3. DEPLOY - RESTART JOB (SSH 연결 안정화 및 서비스 재시작)
  # ===============================================
  deploy-restart:
    name: Restart Service
    needs: deploy-upload
    runs-on: ubuntu-latest
    env:
      RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
    steps:
      - name: Restart Service via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 30s # 연결 타임아웃 명시
          # 🌟 연결 안정성 옵션 추가: 연결이 끊기는 현상 방지
          options: '-o StrictHostKeyChecking=no -o ServerAliveInterval=10 -o ServerAliveCountMax=3'
          script: |
            # 1. 환경 변수 설정
            export RDS_PASSWORD=${{ env.RDS_PASSWORD }}
            export REDIS_PASSWORD=${{ env.REDIS_PASSWORD }}
            
            # 2. 서비스 재시작 (sudoers NOPASSWD 설정 필수)
            sudo systemctl daemon-reload
            sudo systemctl restart subway-worker
            
            # 3. 재시작 확인
            sleep 5
            sudo systemctl status subway-worker