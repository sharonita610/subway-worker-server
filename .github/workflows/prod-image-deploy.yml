name: "[PROD] - Build & Push prod image"

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: subway-worker-server

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17 & Build JAR
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build JAR
        run: ./gradlew clean build -x test

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker Image
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          UNIQUE_TAG=$(date +'%Y%m%d')-$SHORT_SHA
          IMAGE_FULL=ghcr.io/${{ github.repository }}

          docker build -t ${{ env.IMAGE_NAME }}:latest -f Dockerfile .

          docker tag ${{ env.IMAGE_NAME }}:latest ${IMAGE_FULL}:${UNIQUE_TAG}
          docker tag ${{ env.IMAGE_NAME }}:latest ${IMAGE_FULL}:latest
          docker push ${IMAGE_FULL}:${UNIQUE_TAG}
          docker push ${IMAGE_FULL}:latest
