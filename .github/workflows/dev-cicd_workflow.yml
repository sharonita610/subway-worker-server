name: "[DEV] - CI/CD to dev server"

on:
  push:
    branches:
      - develop

env:
  IMAGE_NAME: subway-worker-server

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ env.IMAGE_TAG }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17 & Build JAR
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set dynamic image tag
        run: echo "IMAGE_TAG=dev-$(date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build JAR for Docker
        run: ./gradlew clean build -x test

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker Image
        run: |
          IMAGE_FULL=ghcr.io/${{ github.repository }}

          docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -f Dockerfile .

          docker tag ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} ${IMAGE_FULL}:${{ env.IMAGE_TAG }}
          docker tag ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} ${IMAGE_FULL}:dev-latest
          docker push ${IMAGE_FULL}:${{ env.IMAGE_TAG }}
          docker push ${IMAGE_FULL}:dev-latest

