version: 0.2
phases:
  install:
    commands:
      # 💡 [필수] Java 17 Development Kit 설치: 이전에 실패했던 yum 대신 dnf를 사용 (Amazon Linux 2023 환경에 더 적합)
      # yum 대신 dnf 명령을 사용하는 것이 더 성공 확률이 높습니다.
      - echo Installing Java 17 Development Kit...
      - sudo dnf install java-17-amazon-corretto-devel -y
      - java -version

  pre_build:
    commands:
      - echo Cleaning up any Docker remnants and preparing for Gradle build.

  build:
    commands:
      - echo Build started on `date`
      # 💡 [필수] gradlew 파일에 실행 권한 부여
      - chmod +x ./gradlew
      # 💡 [필수] Gradle 빌드 실행 (테스트 건너뛰기)
      - ./gradlew clean build -x test

artifacts:
  files:
    # CodeDeploy에 전달할 파일 목록
    - build/libs/*.jar
    - appspec.yml
    - scripts/**
  discard-paths: no