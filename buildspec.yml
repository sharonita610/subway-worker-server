version: 0.2
phases:
  install:
    commands:
      - echo Installing Java 17 Development Kit...
      # 💡 [필수 수정] CodeBuild 환경에 더 안정적인 yum 명령으로 복구
      - sudo yum install java-17-amazon-corretto-devel -y
      - java -version

  pre_build:
    commands:
      - echo Preparing for Gradle build.

  build:
    commands:
      - echo Build started on `date`
      - chmod +x ./gradlew
      - ./gradlew clean build -x test

artifacts:
  files:
    - build/libs/*.jar
    - appspec.yml
    - scripts/**
  discard-paths: no