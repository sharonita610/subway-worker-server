
cloud:
  aws:
    region:
      static: ap-southeast-2
spring:
  config:
    import: "optional:aws-parameterstore:/config/subway_worker/prod/"
  aws:
    paramstore:
      enable : true
      profile-separator: _
#      prefix: /config/subway_worker/prod/

  datasource:
    url: jdbc:mysql://${rds_host}:3306/subway_db?serverTimezone=UTC&characterEncoding=UTF-8&useSSL=false
    username: admin
    password: ${rds_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: ${redis_host}
      port: 6379
      ssl:
        enabled: true

  toss:
    auth:
      secret-name: toss-partner-mtls-certs
      aad-string: ${toss_aad_string}
      decryption-key-base64: ${toss_decryption_key}
      auth-api-base: https://apps-in-toss-api.toss.im/api-partner/v1/apps-in-toss/user/oauth2

      port: 4000