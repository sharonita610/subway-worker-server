
cloud:
  aws:
    region:
      static: ap-southeast-2
spring:
  config:
    import: "optional:aws-parameterstore:${AWS_PARAM_PATH:/config/subway_worker/prod/}"
  aws:
    paramstore:
      enable : true
      profile-separator: _
#      prefix: /config/subway_worker/prod/

  datasource:
    url: ${RDS_URL}
    username: ${RDS_USERNAME}
    password: ${rds_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: ${redis_host}
      port: 6379
      ssl:
        enabled: true

  toss:
    auth:
      secret-name: ${TOSS_SECRET_NAME}
      aad-string: ${toss_aad_string}
      decryption-key-base64: ${toss_decryption_key}
      auth-api-base: ${TOSS_AUTH_API_BASE}

      port: 4000