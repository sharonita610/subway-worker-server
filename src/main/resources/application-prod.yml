        enabled: true

---
spring:
  config:
    import: "optional:aws-parameterstore:/"
  region:
    static: ap-southeast-2
  paramstore:
    enable : true
    prefix: /config

  datasource:
    url: jdbc:mysql://subway-worker-db.c7iwywymw7wj.ap-southeast-2.rds.amazonaws.com:3306/subway_db?serverTimezone=UTC&characterEncoding=UTF-8&useSSL=false
    username: admin
    password: ${rds.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-test-query: SELECT 1

  toss:
    auth:
      secret-name: toss-partner-mtls-certs
      aad-string: ${toss-aad-string}
      decryption-key-base64: ${toss-decryption-key}
      auth-api-base: https://apps-in-toss-api.toss.im/api-partner/v1/apps-in-toss/user/oauth2

      port: 4000