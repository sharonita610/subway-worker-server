server:
  port: 8080

spring:
  profiles:
    active:
  datasource:
    url: jdbc:mysql://localhost:3306/subway_game?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver

    username: ${LOCALHOST_USER}
    password: ${LOCAL_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379