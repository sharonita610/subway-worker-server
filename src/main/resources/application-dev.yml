cloud:
  aws:
    region:
      static: ap-southeast-2
spring:
  config:
    import: "optional:aws-parameterstore:${AWS_PARAM_PATH:/config/subway_worker/dev/}"
  aws:
    paramstore:
      enable: true
      profile-separator: _

  datasource:
    url: ${RDS_URL}
    username: ${RDS_USERNAME}
    password: ${rds_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: update

  data:
    redis:
      host: localhost
      port: 6379
